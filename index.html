<!DOCTYPE html>
<html>
    <head>
        <title>Responsive Task</title>
        <link rel="stylesheet" href="style.css">
        <script type="module" src="script.js"></script>
    </head>
    <body>
        <h1>Random Doggos</h1>
        <div>
            <h3>Many Doggos</h3>
            <input id="inputField" type="number" min="0" max="5" oninput="if(this.value > 5)this.value = 5;">
            <button id="morePicture">Add MORE DOGGOS</button>
        </div>
        <div>
            <h3>One Doggo at a time!</h3>
            <button id="pictureButton">Add DOGGO</button>
        </div>
        <div class="flex-container">
        </div>
    </body>
</html>
